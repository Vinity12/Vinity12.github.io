<!DOCTYPE html>

        <a class="NavLink" href="#HobbySection">HOBBIES</a>

    <header id="Introduction">  
      <h1 id="TitleCard">ASHRAF</h1>
      <p id="IntroText">
        A student planning to become a front-end web developer as well as a game developer
      </p>
    </header>
    
    <section id="HobbySection">
      <p class="SectionTitle">Things I Love</p>
      <div id="Hobbies">
        <div id="HobbyArea">
          <div class="Hobby">
            <img src="Images/Second-sentinel.jpg" alt="" class="HobbyImg">
            <div class="GradientOverlay"></div>
            <p class="HobbyText">INDIE GAMES</p>
          </div>
          <div class="Hobby">
            <img src="Images/Sky.jpg" alt="" class="HobbyImg">

          </div>
          <div class="Hobby">

            <div class="GradientOverlay"></div>

          </div>
        </div>

    <section id="ProjectSection">
      <p class="SectionTitle">Projects</p>
      <div id="Projects">
        <a class="Project" href="https://scratch.mit.edu/projects/1325017325/">

    <footer>

        <input type="email" class="info" id="Email" placeholder="Enter your email">
        <input type="password" class="info" id="Pass" placeholder="Enter your password">
